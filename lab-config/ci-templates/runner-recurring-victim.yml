stages:
  - collect

collect-secrets:
  stage: collect
  image: alpine:3.20
  script:
    - 'echo "[+] Running scheduled batch on ${CI_PROJECT_PATH}"'
    - 'echo "[+] Harvest marker: ${HARVEST_STREAM:-unset}"'
    - "env | grep -E 'FLAG|HARVEST_' | sort | tee /tmp/scheduled-secrets.env"
  artifacts:
    paths:
      - /tmp/scheduled-secrets.env
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
  tags:
    - docker
    - shared
