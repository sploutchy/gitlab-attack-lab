stages:
  - build
  - sign
  - deploy

build_android:
  stage: build
  image: openjdk:11
  script:
    - echo "Building Android app..."
    - ./gradlew assembleRelease
    - |
      # VULNERABILITY: Keystore password in logs
      echo "Signing configuration:"
      echo "Keystore: release.keystore"
      echo "Keystore password: MyKeystorePass123!"
      echo "Key alias: release-key"
      echo "Key password: MyKeyPass456!"
  artifacts:
    paths:
      - app/build/outputs/apk/release/
      - release.keystore
    expire_in: 1 day

sign_android:
  stage: sign
  image: openjdk:11
  script:
    - echo "Signing Android APK..."
    - |
      # VULNERABILITY: Signing credentials exposed
      export KEYSTORE_PASSWORD="MyKeystorePass123!"
      export KEY_PASSWORD="MyKeyPass456!"
      export KEY_ALIAS="release-key"
      echo "Keystore password: $KEYSTORE_PASSWORD"
      echo "Key password: $KEY_PASSWORD"
      jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
        -keystore release.keystore -storepass $KEYSTORE_PASSWORD \
        -keypass $KEY_PASSWORD app-release.apk $KEY_ALIAS
  dependencies:
    - build_android

build_ios:
  stage: build
  image: alpine:latest
  script:
    - echo "Building iOS app..."
    - |
      # VULNERABILITY: iOS provisioning profile and certificate details
      echo "iOS Signing configuration:"
      echo "Team ID: ABC1234567"
      echo "Bundle ID: com.company.app"
      echo "Provisioning Profile UUID: 12345678-1234-1234-1234-123456789abc"
      echo "Certificate: iPhone Distribution: Company Name (ABC1234567)"
      export MATCH_PASSWORD="ProvisioningPass123"
      echo "Match password: $MATCH_PASSWORD"
  artifacts:
    paths:
      - build/ios/

deploy_stores:
  stage: deploy
  script:
    - |
      # VULNERABILITY: Store deployment credentials
      export GOOGLE_PLAY_JSON_KEY='{"type": "service_account", "project_id": "my-app", "private_key": "-----BEGIN PRIVATE KEY-----\nMIIEvQIBADANBgkq...\n-----END PRIVATE KEY-----\n"}'
      export APP_STORE_CONNECT_API_KEY="AuthKey_ABC123XYZ.p8"
      export APP_STORE_KEY_ID="ABC123XYZ"
      export APP_STORE_ISSUER_ID="12345678-1234-1234-1234-123456789abc"
      echo "Google Play credentials configured"
      echo "App Store Connect API key: $APP_STORE_KEY_ID"
  only:
    - tags
  when: manual
