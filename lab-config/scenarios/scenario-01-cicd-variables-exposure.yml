scenario:
  name: "Scenario 1: Public CI/CD"
  description: "Three public projects with CI/CD pipelines demonstrating exposure of secrets in unprotected variables"
  difficulty: "beginner"
  tags: ["public-projects", "ci-cd", "secrets-exposure"]

users:
  - username: developer
    email: developer@lab.local
    password: Dev3lop3r@2024!
    is_admin: false
    state: active
    personal_access_tokens:
      - name: "automation-token"
        alias: "automation"
      - name: "ci-pipeline-token"
        alias: "ci"

projects:
  - name: qa-automation
    path: qa-automation
    visibility: public
    members:
      - username: developer
        access_level: 30  # Developer
    issues_enabled: true
    ci_cd_enabled: true
    schedules:
      - description: "QA tests every 2 minutes"
        cron: "*/2 * * * *"
        cron_timezone: "UTC"
        ref: "main"
        active: true
    ci_cd_template: "ci-templates/qa-automation.yml"
