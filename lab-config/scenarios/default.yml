scenario:
  name: "Default Lab Scenario"
  description: "Baseline lab with users, groups, projects, runners, and CI/CD variables"
  difficulty: "beginner"
  tags: ["baseline", "ci-cd", "secrets"]

users:
  - username: alice
    email: alice@lab.local
    password: SecurePass2024!
    is_admin: false
    state: active
  
  - username: bob
    email: bob@lab.local
    password: SecurePass2024!
    is_admin: false
    state: active
  
  - username: charlie
    email: charlie@lab.local
    password: SecurePass2024!
    is_admin: false
    state: active

groups:
  - name: security-team
    path: security-team
    description: "Security research and testing team"
    visibility: private
    members:
      - username: pentester
        access_level: 50  # Owner
      - username: alice
        access_level: 40  # Maintainer
      
  - name: devops-team
    path: devops-team
    description: "DevOps and infrastructure team"
    visibility: private
    members:
      - username: bob
        access_level: 50  # Owner
      - username: charlie
        access_level: 30  # Developer
      
  - name: development-team
    path: development-team
    description: "Development team"
    visibility: private
    members:
      - username: alice
        access_level: 40  # Maintainer
      - username: bob
        access_level: 30  # Developer

  - name: root
    path: root
    description: "Root group for lab scenarios"
    visibility: public

runners:
  # Instance-wide runner (available to all projects)
  - description: shared-docker-runner
    executor: docker
    scope: instance
    tags:
      - docker
      - linux
      - shared
    run_untagged: true
    locked: false
    access_level: not_protected

  # Group-specific runner (only for development-team)
  - description: shell-runner
    executor: shell
    scope: group
    scope_target: development-team
    tags:
      - shell
      - privileged
    run_untagged: true
    locked: false
    access_level: not_protected

projects:
  - name: web-app
    path: web-app
    group: development-team
    description: "Main web application with CI/CD pipeline"
    visibility: private
    default_branch: main
    repo_url: "https://github.com/octocat/Hello-World.git"
    issues_enabled: true
    wiki_enabled: true
    snippets_enabled: true
    ci_cd_enabled: true
    ci_cd_template: "ci-templates/web-app.yml"
    variables:
      - key: DEPLOY_ENV
        value: production
        protected: false
        masked: false
      - key: DEPLOY_TOKEN
        value: "deploy-token-abc123xyz789"
        protected: true
        masked: true
      - key: TEST_DB_HOST
        value: "db.lab.local"
        protected: false
        masked: false
      - key: REGISTRY_URL
        value: "registry.lab.local:5000"
        protected: false
        masked: false

  - name: web-service
    path: web-service
    group: root
    description: "Web service with exposed CI/CD token"
    visibility: public
    default_branch: main
    repo_url: "https://github.com/octocat/Hello-World.git"
    ci_cd_enabled: true
    ci_cd_template: "ci-templates/web-service.yml"
    variables:
      - key: PROVISIONER_TOKEN
        value: 'glpat-xyz1234567890abc'
        protected: false
        masked: false
      
  - name: api-service
    path: api-service
    group: development-team
    description: "REST API service"
    visibility: private
    default_branch: main
    repo_url: "https://github.com/octocat/Spoon-Knife.git"
