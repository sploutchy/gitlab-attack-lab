stages:
  - validate

validate:
  stage: validate
  image: alpine:latest
  script:
    - echo "Validating testing configuration..."
    - echo "Verifying variables"
    - env | grep $TESTING_TOKEN > flags.txt || echo "TESTING_TOKEN not found" 
  artifacts:
    paths:
      - flags.txt
    expire_in: 1 week
  allow_failure: true
