stages:
  - validate
  - plan
  - apply

variables:
  TF_VERSION: "1.5.0"

validate:
  stage: validate
  image: hashicorp/terraform:$TF_VERSION
  script:
    - echo "Validating Terraform configuration..."
    - terraform init
    - |
      # VULNERABILITY: Cloud provider credentials
      echo "Configuring cloud providers..."
      export AWS_ACCESS_KEY_ID="AKIAIOSFODNN7EXAMPLE"
      export AWS_SECRET_ACCESS_KEY="wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
      export ARM_CLIENT_ID="12345678-1234-1234-1234-123456789abc"
      export ARM_CLIENT_SECRET="AzureClientSecret123~"
      export ARM_SUBSCRIPTION_ID="87654321-4321-4321-4321-cba987654321"
      export ARM_TENANT_ID="11111111-1111-1111-1111-111111111111"
      echo "AWS Access Key: $AWS_ACCESS_KEY_ID"
      echo "Azure Client ID: $ARM_CLIENT_ID"
      echo "Azure Tenant: $ARM_TENANT_ID"
    - terraform validate

plan:
  stage: plan
  image: hashicorp/terraform:$TF_VERSION
  script:
    - echo "Planning infrastructure changes..."
    - terraform init
    - |
      # VULNERABILITY: Backend state configuration with credentials
      export TF_STATE_ACCESS_KEY="terraform-state-key-abc123"
      export TF_STATE_SECRET="StateBackendSecret456!"
      echo "State backend access key: $TF_STATE_ACCESS_KEY"
      terraform plan -out=tfplan
    - |
      # VULNERABILITY: Datadog API keys
      export DATADOG_API_KEY="1234567890abcdef1234567890abcdef"
      export DATADOG_APP_KEY="abcdefghijklmnopqrstuvwxyz123456"
      echo "Datadog API key: $DATADOG_API_KEY"
  artifacts:
    paths:
      - tfplan
    expire_in: 1 day

apply:
  stage: apply
  image: hashicorp/terraform:$TF_VERSION
  script:
    - echo "Applying infrastructure changes..."
    - terraform init
    - |
      # VULNERABILITY: Multiple service credentials
      export CLOUDFLARE_API_TOKEN="AbCdEf123456-GhIjKl789012_MnOpQr"
      export GITHUB_TOKEN="ghp_1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZabcd"
      export SLACK_WEBHOOK="https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXXXXXXXXXXXXXX"
      echo "Cloudflare token configured"
      echo "GitHub token: $GITHUB_TOKEN"
      echo "Slack webhook: $SLACK_WEBHOOK"
    - terraform apply tfplan
  dependencies:
    - plan
  only:
    - main
  when: manual
