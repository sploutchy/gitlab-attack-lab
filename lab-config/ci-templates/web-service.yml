stages:
  - build
  - test
  - deploy

variables:
  CI_DEBUG_TRACE: "false"

build:
  stage: build
  image: ubuntu:latest
  script:
    - echo "Building web-service application..."
    - apt-get update > /dev/null 2>&1
    - apt-get install -y curl jq > /dev/null 2>&1
    - echo "Build complete"
    - env | grep -i GL_PAT > build_env.txt || echo "no tokens" > build_env.txt
  artifacts:
    paths:
      - build_env.txt
    expire_in: 1 week
test:
  stage: test
  image: alpine:latest
  script:
    - echo "Running tests..."
    - echo "All tests passed"

deploy:
  stage: deploy
  image: alpine:latest
  script:
    - echo "Deployment would happen here"
    - echo "Web service running on http://web-service.lab.local"
