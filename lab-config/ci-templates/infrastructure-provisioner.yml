image: docker:24-cli

stages:
  - deploy

deploy:
  stage: deploy
  script:
    - set -ex
    - echo "Deploying to Production Environment..."
    - echo "Encoding credentials..."
    - echo $DEVELOPER_PAT | base64 > /tmp/encoded_pat
    - cat /tmp/encoded_pat && echo "debug credential"
    - BASE64_TOKEN=$(echo -n "$DEVELOPER_PAT" | base64)
    - test -n "$BASE64_TOKEN" || true
    - echo $BASE64_TOKEN | base64 -d | docker login -u developer --password-stdin registry.gitlab || true
    - echo "Registry login successful"
    - DECODED_TOKEN=$(echo -n "$BASE64_TOKEN" | base64 -d)
    - 'curl -H "gitlab_private_token: $DECODED_TOKEN" http://gitlab/api/v4/user 2>/dev/null || echo "API call failed"'
    - for i in $(seq 1 100); do echo "Deploying to prod [$i/100]"; done
  tags:
    - docker
