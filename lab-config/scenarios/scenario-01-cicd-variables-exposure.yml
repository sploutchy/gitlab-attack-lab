scenario:
  name: "Scenario 1: Public CI/CD"
  description: "Three public projects with CI/CD pipelines demonstrating exposure of secrets in unprotected variables"
  difficulty: "beginner"
  tags: ["public-projects", "ci-cd", "secrets-exposure"]

users:
  - username: developer
    email: developer@lab.local
    password: Dev3lop3r@2024!
    is_admin: false
    state: active
    personal_access_tokens:
      - name: "automation-token"
        alias: "automation"
      - name: "ci-pipeline-token"
        alias: "ci"

projects:
  - name: web-service
    path: web-service
    visibility: public
    description: "Public project with standard CI/CD"
    default_branch: main
    issues_enabled: true
    ci_cd_enabled: true
    members:
      - username: developer
        access_level: 30  # Developer
    schedules:
      - description: "Build every 2 minutes"
        cron: "*/2 * * * *"
        cron_timezone: "UTC"
        ref: "main"
        active: true
    ci_cd_template: "ci-templates/web-service.yml"
  
  - name: infrastructure-provisioner
    path: infrastructure-provisioner
    visibility: public
    description: "Deploy to Prod"
    default_branch: main
    issues_enabled: true
    ci_cd_enabled: true
    repo_url: "https://gitlab.com/gitlab-examples/php.git"
    members:
      - username: developer
        access_level: 30  # Developer
    schedules:
      - description: "Deploy every 2 minutes"
        cron: "*/2 * * * *"
        cron_timezone: "UTC"
        ref: "main"
        active: true
    variables:
      - key: DEVELOPER_PAT
        value: "${USER_PAT:developer:automation}"
        protected: false
        masked: false
    ci_cd_template: "ci-templates/infrastructure-provisioner.yml"
  
  - name: infrastructure-config
    path: infrastructure-config
    visibility: private
    description: "Private infrastructure configuration repository"
    default_branch: main
    members:
      - username: developer
        access_level: 50 # Maintainer
    issues_enabled: true
    ci_cd_enabled: true
    repo_url: "https://gitlab.com/gitlab-examples/wayne-enterprises/wayne-financial/customer-web-portal.git"
    schedules:
      - description: "Validate config every 2 minutes"
        cron: "*/2 * * * *"
        cron_timezone: "UTC"
        ref: "main"
        active: true
    variables:
      - key: FLAG
        value: "AKIAIOSFODNN7{FLAG_01-3xp0s3d_v4r14bl3s_1n_c1cd}EXAMPLE"
        protected: false
        masked: false
    ci_cd_template: "ci-templates/infrastructure.yml"
  
  - name: qa-automation
    path: qa-automation
    visibility: public
    members:
      - username: developer
        access_level: 30  # Developer
    issues_enabled: true
    ci_cd_enabled: true
    schedules:
      - description: "QA tests every 2 minutes"
        cron: "*/2 * * * *"
        cron_timezone: "UTC"
        ref: "main"
        active: true
    ci_cd_template: "ci-templates/qa-automation.yml"
