image: python:3.11

stages:
  - test
  - build

tests:
  stage: test
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - pytest -q
  tags:
    - docker

package:
  stage: build
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - python -m pip install build
    - python -m build
  artifacts:
    paths:
      - dist/
  tags:
    - docker
