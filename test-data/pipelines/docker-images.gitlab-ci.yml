stages:
  - build
  - push
  - deploy

build_image:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - echo "Building Docker image..."
    - |
      # VULNERABILITY: Docker registry credentials in logs
      echo "Registry: registry.company.com"
      export DOCKER_USERNAME="docker-user"
      export DOCKER_PASSWORD="DockerPass123!"
      echo "Username: $DOCKER_USERNAME"
      echo "Password: $DOCKER_PASSWORD"
      echo $DOCKER_PASSWORD | docker login registry.company.com -u $DOCKER_USERNAME --password-stdin
    - docker build -t myapp:latest .
    - |
      # VULNERABILITY: NPM token in build args
      export NPM_TOKEN="npm_AbCdEf1234567890GhIjKlMnOpQrStUvWx"
      echo "NPM Token: $NPM_TOKEN"
      docker build --build-arg NPM_TOKEN=$NPM_TOKEN -t myapp:with-deps .

push_image:
  stage: push
  image: docker:latest
  services:
    - docker:dind
  script:
    - echo "Pushing Docker image..."
    - |
      # VULNERABILITY: Multiple registry credentials
      export DOCKER_HUB_TOKEN="dckr_pat_AbCdEfGhIjKlMnOpQrStUvWxYz123456"
      export AWS_ECR_PASSWORD="eyJwYXlsb2FkIjoiQUJDREVGR0hJSktMTU5PUFFSU1RVVld"
      export GCR_KEY_FILE='{"type":"service_account","project_id":"my-project","private_key":"-----BEGIN PRIVATE KEY-----\nMIIEvQIBADANBg..."}'
      echo "Docker Hub token: $DOCKER_HUB_TOKEN"
      echo "AWS ECR password configured"
      echo "GCR service account configured"
    - docker push registry.company.com/myapp:latest

deploy_k8s:
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    - echo "Deploying to Kubernetes..."
    - |
      # VULNERABILITY: Kubernetes credentials and secrets
      export KUBE_TOKEN="eyJhbGciOiJSUzI1NiIsImtpZCI6IjEyMzQ1Njc4OTAifQ.eyJpc3MiOiJrdWJlcm5ldGVzL3NlcnZpY2VhY2NvdW50Iiwia3ViZXJuZXRlcy5pby9zZXJ2aWNlYWNjb3VudC9uYW1lc3BhY2UiOiJkZWZhdWx0In0.AbCdEfGhIjKlMnOpQrStUvWxYz"
      export KUBE_URL="https://k8s-cluster.company.com:6443"
      export IMAGE_PULL_SECRET="docker-registry-secret"
      export DB_PASSWORD="K8sDbPass123!"
      echo "Kubernetes API: $KUBE_URL"
      echo "Kube token: $KUBE_TOKEN"
      echo "DB Password: $DB_PASSWORD"
    - kubectl apply -f k8s/deployment.yaml
  only:
    - main
