stages:
  - build
  - test
  - deploy

variables:
  NODE_ENV: "production"

build:
  stage: build
  image: node:16
  script:
    - echo "Building web application..."
    - npm install
    - |
      # VULNERABILITY: Hardcoded AWS credentials leaked in build logs
      echo "Configuring AWS CLI..."
      export AWS_ACCESS_KEY_ID="AKIAIOSFODNN7EXAMPLE"
      export AWS_SECRET_ACCESS_KEY="wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
      echo "AWS Region: us-east-1"
    - npm run build
    - echo "Build complete"
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

test:
  stage: test
  image: node:16
  script:
    - echo "Running tests..."
    - npm test
    - |
      # VULNERABILITY: API token exposed in test logs
      echo "Testing API connection..."
      curl -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.secret-api-token" https://api.example.com/test
  dependencies:
    - build

deploy:
  stage: deploy
  image: node:16
  script:
    - echo "Deploying to production..."
    - |
      # VULNERABILITY: SSH private key in environment
      echo "Setting up deployment credentials..."
      export DEPLOY_KEY="-----BEGIN RSA PRIVATE KEY-----
      MIIEpAIBAAKCAQEA1234567890abcdef...
      -----END RSA PRIVATE KEY-----"
    - npm run deploy
  only:
    - main
  environment:
    name: production
    url: https://app.example.com
