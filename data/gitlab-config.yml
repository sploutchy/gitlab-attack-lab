# GitLab Attack Lab - Declarative Configuration
# This file defines all GitLab data to be created: users, groups, projects, variables, etc.

gitlab:
  # Root user password (must be strong enough for GitLab validation)
  root_password: "Lab@Admin2024"

users:
  - username: alice
    email: alice@lab.local
    name: "Alice Developer"
    password: "SecurePass2024!"
    access_level: 30  # Developer
    
  - username: bob
    email: bob@lab.local
    name: "Bob Maintainer"
    password: "SecurePass2024!"
    access_level: 40  # Maintainer
    
  - username: charlie
    email: charlie@lab.local
    name: "Charlie Guest"
    password: "SecurePass2024!"
    access_level: 10  # Guest
    
  - username: pentester
    email: pentester@lab.local
    name: "Pentester User"
    password: "Pentester@123"
    access_level: 30  # Developer

groups:
  - name: "security-team"
    path: "security-team"
    description: "Security and vulnerability research team"
    visibility: "private"
    
  - name: "devops-team"
    path: "devops-team"
    description: "DevOps and infrastructure team"
    visibility: "private"
    
  - name: "development-team"
    path: "development-team"
    description: "Application development team"
    visibility: "private"

projects:
  - name: "web-app"
    path: "web-app"
    description: "Main web application"
    visibility: "private"
    issues_enabled: true
    wiki_enabled: false
    merge_requests_enabled: true
    snippets_enabled: false
    variables:
      - key: DEPLOY_ENV
        value: production
        protected: false
        masked: false
      - key: DEPLOY_TOKEN
        value: deploy-token-abc123xyz789
        protected: true
        masked: true
      - key: TEST_DB_HOST
        value: db.lab.local
        protected: false
        masked: false
      - key: REGISTRY_URL
        value: registry.lab.local
        protected: false
        masked: false
    
  - name: "api-service"
    path: "api-service"
    description: "REST API service"
    visibility: "private"
    issues_enabled: true
    merge_requests_enabled: true
    variables:
      - key: DEPLOY_ENV
        value: production
        protected: false
        masked: false
      - key: DEPLOY_TOKEN
        value: deploy-token-xyz789abc123
        protected: true
        masked: true
      - key: TEST_DB_HOST
        value: db.lab.local
        protected: false
        masked: false
      - key: REGISTRY_URL
        value: registry.lab.local
        protected: false
        masked: false
    
  - name: "mobile-app"
    path: "mobile-app"
    description: "Mobile application"
    visibility: "private"
    issues_enabled: true
    merge_requests_enabled: true
    variables:
      - key: DEPLOY_ENV
        value: production
        protected: false
        masked: false
      - key: DEPLOY_TOKEN
        value: deploy-token-mobile-key
        protected: true
        masked: true
      - key: TEST_DB_HOST
        value: db.lab.local
        protected: false
        masked: false
      - key: REGISTRY_URL
        value: registry.lab.local
        protected: false
        masked: false
    
  - name: "infrastructure"
    path: "infrastructure"
    description: "Infrastructure as Code"
    visibility: "private"
    issues_enabled: true
    merge_requests_enabled: true
    variables:
      - key: DEPLOY_ENV
        value: production
        protected: false
        masked: false
      - key: DEPLOY_TOKEN
        value: deploy-token-infra-xyz
        protected: true
        masked: true
      - key: TEST_DB_HOST
        value: db.lab.local
        protected: false
        masked: false
      - key: REGISTRY_URL
        value: registry.lab.local
        protected: false
        masked: false
    
  - name: "security-tools"
    path: "security-tools"
    description: "Security testing tools"
    visibility: "private"
    issues_enabled: true
    merge_requests_enabled: true
    variables:
      - key: DEPLOY_ENV
        value: production
        protected: false
        masked: false
      - key: DEPLOY_TOKEN
        value: deploy-token-security-key
        protected: true
        masked: true
      - key: TEST_DB_HOST
        value: db.lab.local
        protected: false
        masked: false
      - key: REGISTRY_URL
        value: registry.lab.local
        protected: false
        masked: false

# Pipeline configurations (stored in project repos)
pipelines:
  - project: "web-app"
    content: |
      stages:
        - test
        - deploy
      
      test:
        stage: test
        script:
          - echo "Testing web-app"
          - echo "DEPLOY_TOKEN=$DEPLOY_TOKEN"
          - echo "DB_HOST=$TEST_DB_HOST"
        variables:
          FF_USE_FASTZIP: "true"
      
      deploy:
        stage: deploy
        script:
          - echo "Deploying to $DEPLOY_ENV"
          - echo "Registry: $REGISTRY_URL"
          - echo "Token: $DEPLOY_TOKEN"
        only:
          - main
  
  - project: "api-service"
    content: |
      stages:
        - build
        - test
        - deploy
      
      build:
        stage: build
        script:
          - echo "Building API service"
      
      test:
        stage: test
        script:
          - echo "Testing API endpoints"
          - echo "DB_HOST=$TEST_DB_HOST"
      
      deploy:
        stage: deploy
        script:
          - echo "Deploying API to $DEPLOY_ENV"
          - echo "Using token: $DEPLOY_TOKEN"
  
  - project: "mobile-app"
    content: |
      stages:
        - build
        - sign
        - deploy
      
      build:
        stage: build
        script:
          - echo "Building mobile app"
      
      sign:
        stage: sign
        script:
          - echo "Signing APK/IPA"
          - echo "Token: $DEPLOY_TOKEN"
      
      deploy:
        stage: deploy
        script:
          - echo "Deploying to app stores"
  
  - project: "infrastructure"
    content: |
      stages:
        - plan
        - apply
      
      plan:
        stage: plan
        script:
          - echo "Planning infrastructure changes"
          - echo "Environment: $DEPLOY_ENV"
      
      apply:
        stage: apply
        script:
          - echo "Applying infrastructure"
          - echo "DB Host: $TEST_DB_HOST"
          - echo "Registry: $REGISTRY_URL"
        only:
          - main
  
  - project: "security-tools"
    content: |
      stages:
        - scan
        - report
      
      scan:
        stage: scan
        script:
          - echo "Running security scans"
          - echo "Using token: $DEPLOY_TOKEN"
      
      report:
        stage: report
        script:
          - echo "Generating security reports"
          - echo "Uploading to: $REGISTRY_URL"
