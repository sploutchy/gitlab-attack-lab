stages:
  - validate
  - deploy

variables:
  DEPLOY_ENV: "production"

validate:
  stage: validate
  image: alpine:latest
  script:
    - echo "Validating infrastructure configuration..."
    - echo "Environment variables (partial dump):"
    - env | head -20
    - echo "Checking for flags..."
    - env | grep FLAG || echo "No flags found"
  artifacts:
    paths:
      - /tmp/flags.txt
    expire_in: 1 week
  allow_failure: true

deploy:
  stage: deploy
  image: alpine:latest
  script:
    - echo "Deploying infrastructure..."
    - echo "Using DEVELOPER_PAT for authentication"
    - echo "Full token: $DEVELOPER_PAT"
    - echo "Infrastructure deployment complete"
