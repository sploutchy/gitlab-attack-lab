name: GitLab Attack Lab - Static Validation

# Note: Full integration tests require local execution due to GitLab's resource requirements.
# This workflow runs static validation only (syntax checks, YAML validation, etc.)
# For full integration tests, run locally: make setup && pytest tests/

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  static-validation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install requests pyyaml pytest
      
      - name: Run static validation tests
        run: |
          echo "Running static validation (syntax, imports, config files)..."
          python -m pytest tests/test_static.py -v --tb=short
      
      - name: Validate bash scripts
        run: |
          echo "Validating bash script syntax..."
          bash -n setup.sh
      
      - name: Validate YAML files
        run: |
          echo "Validating YAML configuration files..."
          python -c "import yaml; yaml.safe_load(open('docker-compose.yml')); yaml.safe_load(open('lab-config/structure.yml'))"
          echo "All YAML files are valid!"
